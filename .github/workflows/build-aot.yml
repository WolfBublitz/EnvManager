name: Build .NET AOT App

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build ${{ matrix.rid }} AOT
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-26.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Restore
        working-directory: src
        run: dotnet restore

      - name: Publish AOT
        working-directory: src
        run:  dotnet publish EnvManager.csproj -c Release -r ${{ matrix.rid }} /p:PublishAot=true /p:PublishSingleFile=true /p:StripSymbols=true /p:IlcOptimizationPreference=Speed /p:DebuggerSupport=false /p:EnableUnsafeBinaryFormatterSerialization=false

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release
          cp "src/bin/Release/net11.0/${{ matrix.rid }}/publish/EnvManager${{ matrix.os == 'windows-latest' && '.exe' || '' }}" "release/EnvManager-${{ matrix.rid }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aot-${{ matrix.rid }}
          path: release/EnvManager-${{ matrix.rid }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  release:
    name: Upload release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: aot-*
          path: release
          merge-multiple: true

      - name: Upload assets to existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release/* --clobber
